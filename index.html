<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Menu Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Our Menu</h1>
      <div class="btns">
        <button onclick="menu()">All</button>
        <button onclick="menu('breakfast')">Breakfast</button>
        <button onclick="menu('lunch')">Lunch</button>
        <button onclick="menu('shakes')">Shakes</button>
      </div>
    </div>
    <div class="foodItems">
      <div class="img">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKs98mWzpqdzTefx6qdTN2X-Us2MFdhWA91Yi2guZaXw&s=10"
          alt=""
        />
      </div>

      <div class="title">
        <h1>Biryani</h1>
      </div>

      <div class="price">
        <p>300</p>
      </div>

      <div class="description">
        <p>
          Lorem ipsum, dolor sit amet consectetur adipisicing elit. At ipsam
          nisi saepe perferendis perspiciatis earum assumenda magni eius
          recusandae vitae, ullam eos minus aliquid, asperiores ratione fugit
          quasi necessitatibus placeat!
        </p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
